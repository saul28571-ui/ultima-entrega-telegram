<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101a2b">
<title>Última Entrega — juego</title>
<style>
:root{--bg:#0a1020;--panel:#121c30;--panel2:#1a2740;--line:#2c3a54;--ink:#f4f7ff;--muted:#9aabc5;--lime:#c8ff50;--orange:#ffad5a;--red:#ff6474;--blue:#70c8ff}
*{box-sizing:border-box} html,body{width:100%;min-height:100%;margin:0} body{background:radial-gradient(ellipse at top,#182642 0%,var(--bg) 58%);color:var(--ink);font:500 15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;min-height:100dvh;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center}
.wrap{width:min(100%,520px);min-height:calc(100dvh - max(10px,env(safe-area-inset-top)) - max(12px,env(safe-area-inset-bottom)));margin:0 auto;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--lime);color:#15202a;border-radius:14px;font-size:23px;box-shadow:0 5px 22px #c8ff5030}.brand h1{font-size:19px;line-height:1.05;margin:0;letter-spacing:.02em}.brand small{color:var(--muted);font-size:11px;letter-spacing:.11em;text-transform:uppercase}.chip{border:1px solid var(--line);background:#ffffff08;padding:7px 10px;border-radius:99px;color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}.stat{background:linear-gradient(150deg,#18243a,#111a2b);border:1px solid #2b3a54;border-radius:14px;padding:10px 12px;min-height:63px}.stat label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.stat strong{font-size:20px;line-height:1.4}.stat .tiny{font-size:12px;color:var(--muted);font-weight:600}.timerbar{height:4px;border-radius:8px;background:#26334a;margin:-2px 2px 12px;overflow:hidden}.timerfill{height:100%;background:var(--lime);width:100%;transition:width .3s,background .3s}
